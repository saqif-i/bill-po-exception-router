# Runs on every push and pull request.
#
# This workflow declares NO third-party secrets. If a change ever makes CI
# require a Xero, Slack or Anthropic credential, that change is wrong.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the full history
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  workflow-exports:
    name: no credentials in workflow exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan n8n exports
        run: |
          if [ -d n8n/workflows ]; then
            if grep -rEl '"(value|password|token|secret|apiKey)"[[:space:]]*:[[:space:]]*"[^"]{12,}"' n8n/workflows; then
              echo "credential-shaped value in a committed workflow export" >&2
              exit 1
            fi
          fi
          echo "clean"

  lint:
    name: format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned, because a guide that pins its runtime images and then
      # floats its linter is inconsistent with itself.
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .

  test:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned to the same major the guide pins locally.
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: bootstrap, exactly as the container does
        env:
          PGPASSWORD: ci
          POSTGRES_USER: ci
          APP_DB_NAME: bpr
          N8N_DB_NAME: n8n
          BPR_OWNER_USER: bpr_owner
          BPR_OWNER_PASSWORD: ci-owner-pw
          N8N_DB_USER: n8n_app
          N8N_DB_PASSWORD: ci-n8n-pw
          PGHOST: localhost
          PGPORT: "5432"
        # The real script, not a hand-written approximation. A bootstrap that
        # only works in the container is a bootstrap nobody has tested.
        run: ./docker/postgres/init/001-bootstrap.sh

      - name: migrate
        env:
          # Migration 001 creates the runtime login roles. Without these it
          # refuses rather than creating roles that cannot authenticate.
          BPR_APP_PASSWORD: ci-app-pw
          BPR_RETENTION_PASSWORD: ci-retention-pw
          BPR_OWNER_DATABASE_URL: postgresql://bpr_owner:ci-owner-pw@localhost:5432/bpr
        run: python -m policy_service.db.migrate

      - name: prove the n8n boundary holds
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          N8N_DB_USER: n8n_app
          N8N_DB_PASSWORD: ci-n8n-pw
          BPR_OWNER_DATABASE_URL: postgresql://bpr_owner:ci-owner-pw@localhost:5432/bpr
        run: python scripts/check_db_boundaries.py

      - name: pytest, excluding live
        env:
          # Both URLs, not just the owner one. Without the app URL the
          # integration tests skip silently and CI reports green having tested
          # nothing.
          BPR_OWNER_DATABASE_URL: postgresql://bpr_owner:ci-owner-pw@localhost:5432/bpr
          BPR_DATABASE_URL: postgresql://bpr_app:ci-app-pw@localhost:5432/bpr
          INTERNAL_BEARER_TOKEN: ci-token-not-a-real-secret-0000000
        run: pytest -m "not live"

      - name: assert the integration tests actually ran
        env:
          BPR_OWNER_DATABASE_URL: postgresql://bpr_owner:ci-owner-pw@localhost:5432/bpr
          BPR_DATABASE_URL: postgresql://bpr_app:ci-app-pw@localhost:5432/bpr
          INTERNAL_BEARER_TOKEN: ci-token-not-a-real-secret-0000000
        # A skipped integration suite looks identical to a passing one.
        run: pytest tests/integration -m "not live" --collect-only -q | tail -1

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt -r requirements-dev.txt