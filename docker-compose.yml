# Images are pinned by tag AND digest (docs/change-control.md). A floating tag
# would make "the same docker compose up" mean two different things on two
# days, which contradicts the locked dependency set.
services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to a tag@sha256 digest pair}
    environment:
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${APP_DB_NAME:-bpr}
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
      BPR_OWNER_USER: ${BPR_OWNER_USER:-bpr_owner}
      BPR_OWNER_PASSWORD: ${BPR_OWNER_PASSWORD:?}
      N8N_DB_USER: ${N8N_DB_USER:-n8n_app}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?}
    volumes:
      # Runs once, on first initialisation of the data volume only.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Published on 5433 because macOS installs commonly hold 5432. The
      # container-internal port is unchanged, so BPR_DATABASE_URL still uses
      # postgres:5432: that connection never leaves the Docker network.
      # Bound to loopback. Without the address, Docker publishes on every
      # interface, so a laptop on a cafe network exposes the database.
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  policy_service:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:?set PYTHON_BASE_IMAGE to a tag@sha256 digest pair}
    environment:
      # The runtime role. Never the owner, never the bootstrap superuser.
      BPR_DATABASE_URL: ${BPR_DATABASE_URL:?}
      INTERNAL_BEARER_TOKEN: ${INTERNAL_BEARER_TOKEN:?}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      XERO_WRITE_MODE: ${XERO_WRITE_MODE:-disabled}

      # Compose passes through ONLY what is listed here. A variable in .env that
      # is not named below never reaches the container, and the service reports
      # the provider as unconfigured rather than misbehaving.
      #
      # Optional by design (`:-`), so the stack starts before any provider is
      # configured and the tests keep running without any credential.
      XERO_CLIENT_ID: ${XERO_CLIENT_ID:-}
      XERO_CLIENT_SECRET: ${XERO_CLIENT_SECRET:-}
      XERO_SCOPES: ${XERO_SCOPES:-accounting.transactions.read accounting.settings.read accounting.contacts.read}
      XERO_EXPECTED_ORG_NAME: ${XERO_EXPECTED_ORG_NAME:-Demo Company}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SEMANTIC_REVIEW_ENABLED: ${SEMANTIC_REVIEW_ENABLED:-false}
      SEMANTIC_MODEL_ID: ${SEMANTIC_MODEL_ID:-}
      SEMANTIC_MIN_CONFIDENCE: ${SEMANTIC_MIN_CONFIDENCE:-0.6}

      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only. Slack reaches this through a local tunnel,
      # which terminates locally, so nothing needs a public bind.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6

  n8n:
    image: ${N8N_IMAGE:?set N8N_IMAGE to a tag@sha256 digest pair}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n_app}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?}
      # The ONLY application secret n8n holds (ADR-002). It reaches the service
      # by container name: inside a container, localhost is that container.
      POLICY_SERVICE_URL: http://policy_service:8000
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Australia/Melbourne}
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
